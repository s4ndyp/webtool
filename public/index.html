<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subsite-portal</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div>
          <h1>Subsite-portal</h1>
          <p class="subtitle">Upload een map en open je app via een tegel.</p>
        </div>
        <div class="header-actions">
          <button
            type="button"
            id="btn-edit"
            class="btn btn-ghost"
            aria-pressed="false"
          >
            Bewerken
          </button>
          <button type="button" id="btn-new" class="btn btn-primary">
            Nieuwe subsite
          </button>
        </div>
      </header>

      <main>
        <p id="edit-hint" class="edit-hint hidden">
          Klik op een tegel om naam, slug of icoon aan te passen. Gebruik × om te
          verwijderen.
        </p>
        <div id="tiles" class="tiles" aria-live="polite"></div>
        <p id="empty-state" class="empty-state hidden">
          Nog geen subsites. Klik op <strong>Nieuwe subsite</strong> om te
          beginnen.
        </p>
        <p id="load-error" class="error-banner hidden"></p>
      </main>
    </div>

    <dialog id="dialog-create" class="dialog">
      <form id="form-create" method="dialog" class="dialog-inner">
        <header class="dialog-header">
          <h2>Nieuwe subsite</h2>
          <button type="button" class="icon-btn" id="btn-close" aria-label="Sluiten">
            &times;
          </button>
        </header>

        <label class="field">
          <span>Naam van de app</span>
          <input
            type="text"
            id="input-name"
            name="name"
            required
            maxlength="200"
            placeholder="Mijn webapp"
            autocomplete="off"
          />
        </label>

        <label class="field">
          <span>URL-slug</span>
          <input
            type="text"
            id="input-slug"
            name="slug"
            required
            maxlength="100"
            pattern="^[a-z0-9]+(?:-[a-z0-9]+)*$"
            placeholder="mijn-webapp"
          />
          <small>Alleen kleine letters, cijfers en streepjes.</small>
        </label>

        <label class="field">
          <span>Map met websitebestanden</span>
          <input
            type="file"
            id="input-folder"
            name="folder"
            webkitdirectory
            directory
            multiple
            required
          />
          <small>Selecteer de map waarin o.a. index.html staat.</small>
        </label>

        <label class="field">
          <span>Tegel-icoon (optioneel)</span>
          <input
            type="file"
            id="input-icon"
            name="icon"
            accept="image/jpeg,image/png,image/webp,image/gif,image/svg+xml"
          />
        </label>

        <p id="form-error" class="form-error hidden"></p>
        <progress id="upload-progress" class="upload-progress hidden" max="100" value="0"></progress>
        <p id="upload-status" class="upload-status hidden"></p>

        <footer class="dialog-footer">
          <button type="button" class="btn btn-ghost" id="btn-cancel">Annuleren</button>
          <button type="submit" class="btn btn-primary" id="btn-submit">
            Uploaden &amp; publiceren
          </button>
        </footer>
      </form>
    </dialog>

    <dialog id="dialog-edit" class="dialog">
      <form id="form-edit" method="dialog" class="dialog-inner">
        <header class="dialog-header">
          <h2>Subsite bewerken</h2>
          <button
            type="button"
            class="icon-btn"
            id="btn-edit-close"
            aria-label="Sluiten"
          >
            &times;
          </button>
        </header>

        <label class="field">
          <span>Naam van de app</span>
          <input
            type="text"
            id="edit-name"
            name="name"
            required
            maxlength="200"
            autocomplete="off"
          />
        </label>

        <label class="field">
          <span>URL-slug</span>
          <input
            type="text"
            id="edit-slug"
            name="slug"
            required
            maxlength="100"
            pattern="^[a-z0-9]+(?:-[a-z0-9]+)*$"
          />
          <small>Wijzigen verandert het adres (/s/&lt;slug&gt;/).</small>
        </label>

        <label class="field">
          <span>Nieuw tegel-icoon (optioneel)</span>
          <input
            type="file"
            id="edit-icon"
            name="icon"
            accept="image/jpeg,image/png,image/webp,image/gif,image/svg+xml"
          />
        </label>

        <label class="field">
          <span>Websitebestanden vervangen (optioneel)</span>
          <input
            type="file"
            id="edit-folder"
            name="folder"
            webkitdirectory
            directory
            multiple
          />
          <small>Vervangt alle bestanden van deze subsite door de gekozen map.</small>
        </label>

        <p id="edit-form-error" class="form-error hidden"></p>
        <progress
          id="edit-upload-progress"
          class="upload-progress hidden"
          max="100"
          value="0"
        ></progress>
        <p id="edit-upload-status" class="upload-status hidden"></p>

        <footer class="dialog-footer">
          <button type="button" class="btn btn-ghost" id="btn-edit-cancel">
            Annuleren
          </button>
          <button type="submit" class="btn btn-primary" id="btn-edit-save">
            Opslaan
          </button>
        </footer>
      </form>
    </dialog>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
